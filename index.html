// ============================================================
// SRS: интервальное повторение (Leitner)
// ============================================================
const INTERVALS_DAYS = [0, 1, 3, 7, 14, 30]; // box 0..5
const MS_DAY = 24 * 60 * 60 * 1000;

const STORAGE_KEY = 'quran_vocab_v1';

const defaultProgress = (id) => ({
  id,
  level: 0,
  nextReview: Date.now(),
  lastReview: null,
  seen: 0,
  correct: 0,
});

function scheduleNext(level) {
  const days = INTERVALS_DAYS[Math.min(level, INTERVALS_DAYS.length - 1)];
  return Date.now() + days * MS_DAY;
}

function applyAnswer(p, grade) {
  // grade: 'again' | 'hard' | 'good' | 'easy'
  let nextLevel = p.level;
  if (grade === 'again') nextLevel = 0;
  else if (grade === 'hard') nextLevel = Math.max(0, p.level - 1);
  else if (grade === 'good') nextLevel = Math.min(5, p.level + 1);
  else if (grade === 'easy') nextLevel = Math.min(5, p.level + 2);
  return {
    ...p,
    level: nextLevel,
    nextReview: scheduleNext(nextLevel),
    lastReview: Date.now(),
    seen: p.seen + 1,
    correct: p.correct + (grade === 'again' ? 0 : 1),
  };
}

const Home = ({ progressMap, onPickCategory, onReviewWeak, onReviewDue, onLearnNew, onReset }) => {
  const totals = useMemo(() => {
    let learned = 0, weak = 0, due = 0, seen = 0, fresh = 0;
    const now = Date.now();
    WORDS.forEach(w => {
      const p = progressMap[w.id] || defaultProgress(w.id);
      if (p.level >= 4) learned++;
      if (p.level === 0 && p.seen > 0) weak++;
      if (p.nextReview <= now && p.seen > 0) due++;
      if (p.seen > 0) seen++; else fresh++;
    });
    return { learned, weak, due, seen, fresh };
  }, [progressMap]);

  const categoryStats = useMemo(() => {
    const stats = {};
    CATEGORIES.forEach(c => stats[c.id] = { total: 0, learned: 0, seen: 0, weak: 0 });
    WORDS.forEach(w => {
      const p = progressMap[w.id] || defaultProgress(w.id);
      const s = stats[w.cat];
      s.total++;
      if (p.level >= 4) s.learned++;
      if (p.seen > 0) s.seen++;
      if (p.level === 0 && p.seen > 0) s.weak++;
    });
    return stats;
  }, [progressMap]);

  return (
    <div style={{ maxWidth: 760, margin: '0 auto', padding: '32px 22px 80px' }}>
      {/* HERO */}
      <header style={{ marginBottom: 36 }}>
        <div style={{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between', marginBottom: 12 }}>
          <Pill bg="transparent" color={C.inkMuted} style={{ padding: 0 }}>
            مفردات • Словарь
          </Pill>
          <button onClick={onReset} title="Сбросить прогресс"
            style={{ background: 'none', border: 'none', color: C.inkMuted, cursor: 'pointer', padding: 4 }}>
            <IconSettings size={16} />
          </button>
        </div>
        <div style={{ fontFamily: F.arabic, fontSize: 44, color: C.ink, lineHeight: 1.2, marginBottom: 6, direction: 'rtl' }}>
          كَلِمَاتُ القُرْآنِ
        </div>
        <FrameTitle style={{ fontSize: 22, color: C.inkSoft, fontStyle: 'italic' }}>
          Топ-300 частых слов Корана
        </FrameTitle>
        <div style={{ fontFamily: F.body, fontSize: 13, color: C.inkMuted, marginTop: 8, lineHeight: 1.6 }}>
          Интервальное повторение по системе Лейтнера. Шесть уровней — от новых до закреплённых.
        </div>
      </header>

      {/* STATS */}
      <div style={{
        display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 10, marginBottom: 28,
        padding: '18px 16px', background: C.paper, borderRadius: 16, border: `1px solid ${C.rule}`,
      }}>
        <StatCell label="Изучено" value={totals.learned} max={WORDS.length} accent={C.sage} />
        <StatCell label="К повтору" value={totals.due} accent={C.terracotta} />
        <StatCell label="Слабые" value={totals.weak} accent={C.gold} />
        <StatCell label="Видел" value={totals.seen} max={WORDS.length} accent={C.inkSoft} />
      </div>

      {/* ПРИОРИТЕТНЫЕ КНОПКИ */}
      <div style={{ display: 'grid', gap: 12, marginBottom: 32 }}>
        <BigAction
          onClick={onLearnNew}
          icon={<IconBookOpen size={20} />}
          title="Учить новые слова"
          subtitle={`${totals.fresh} ${plural(totals.fresh, 'новое слово', 'новых слова', 'новых слов')} впереди`}
          bg={C.ink}
          fg="#FFF8EE"
          disabled={totals.fresh === 0}
        />
        <BigAction
          onClick={onReviewWeak}
          icon={<IconAlert size={20} />}
          title="На повторение"
          subtitle={`${totals.weak} ${plural(totals.weak, 'слабое слово', 'слабых слова', 'слабых слов')}`}
          bg={C.terracotta}
          fg="#FFF8EE"
          disabled={totals.weak === 0}
        />
        <BigAction
          onClick={onReviewDue}
          icon={<IconSparkles size={20} />}
          title="Запланированные на сегодня"
          subtitle={`${totals.due} ${plural(totals.due, 'карточка ждёт', 'карточки ждут', 'карточек ждут')}`}
          bg={C.sage}
          fg="#FFF8EE"
          disabled={totals.due === 0}
        />
      </div>

      {/* СПИСОК РАЗДЕЛОВ */}
      <div style={{ marginBottom: 14, display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }}>
        <FrameTitle style={{ fontSize: 20, color: C.ink }}>Разделы</FrameTitle>
        <span style={{ fontFamily: F.mono, fontSize: 11, color: C.inkMuted }}>
          {CATEGORIES.length} тем
        </span>
      </div>

      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(auto-fill, minmax(220px, 1fr))', gap: 10 }}>
        {CATEGORIES.map((cat, idx) => {
          const s = categoryStats[cat.id];
          const pct = Math.round((s.learned / s.total) * 100);
          return (
            <button key={cat.id} onClick={() => onPickCategory(cat.id)}
              style={{
                textAlign: 'left', background: C.paper, border: `1px solid ${C.rule}`, borderRadius: 14,
                padding: '16px 16px 14px', cursor: 'pointer', position: 'relative', overflow: 'hidden',
                transition: 'transform .15s ease, border-color .15s ease',
              }}
              onMouseEnter={e => { e.currentTarget.style.borderColor = cat.accent; }}
              onMouseLeave={e => { e.currentTarget.style.borderColor = C.rule; }}>
              <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 8 }}>
                <div>
                  <div style={{ fontFamily: F.mono, fontSize: 10, color: cat.accent, letterSpacing: '0.1em', marginBottom: 4 }}>
                    {String(idx + 1).padStart(2, '0')}
                  </div>
                  <FrameTitle style={{ fontSize: 18, color: C.ink, lineHeight: 1.2 }}>{cat.name}</FrameTitle>
                </div>
                <div style={{ fontFamily: F.arabic, fontSize: 18, color: cat.accent, direction: 'rtl', opacity: 0.85, marginTop: 2 }}>
                  {cat.ar}
                </div>
              </div>
              <div style={{ fontFamily: F.body, fontSize: 12, color: C.inkMuted, marginBottom: 10 }}>
                <Mono style={{ color: C.inkSoft }}>{s.learned}</Mono> / {s.total} выучено
                {s.weak > 0 && <span style={{ marginLeft: 8, color: C.terracotta }}>· {s.weak} слаб.</span>}
              </div>
              <div style={{ height: 3, background: C.creamDark, borderRadius: 2, overflow: 'hidden' }}>
                <div style={{ height: '100%', width: `${pct}%`, background: cat.accent, transition: 'width .3s' }} />
              </div>
            </button>
          );
        })}
      </div>

      <footer style={{ marginTop: 48, textAlign: 'center', fontFamily: F.body, fontSize: 11, color: C.inkMuted, lineHeight: 1.7 }}>
        <div style={{ fontFamily: F.arabic, fontSize: 16, color: C.inkSoft, marginBottom: 4, direction: 'rtl' }}>
          وَلَقَدْ يَسَّرْنَا الْقُرْآنَ لِلذِّكْرِ
        </div>
        <div style={{ fontStyle: 'italic', fontFamily: F.serif, fontSize: 13 }}>
          «Мы облегчили Коран для поминания»
        </div>
      </footer>
    </div>
  );
};

// ЭКРАН: сессия повторения
// ============================================================
const Session = ({ deck, progressMap, onAnswer, onExit, title }) => {
  const [idx, setIdx] = useState(0);
  const [flipped, setFlipped] = useState(false);
  const [done, setDone] = useState(false);
  const [sessionStats, setSessionStats] = useState({ correct: 0, wrong: 0 });

  // Перемешиваем колоду при монтировании
  const [shuffled] = useState(() => {
    const arr = [...deck];
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  });

  const current = shuffled[idx];
  const total = shuffled.length;

  const handleAnswer = useCallback((grade) => {
    if (!current) return;
    onAnswer(current.id, grade);
    setSessionStats(s => ({
      correct: s.correct + (grade !== 'again' ? 1 : 0),
      wrong: s.wrong + (grade === 'again' ? 1 : 0),
    }));
    if (idx + 1 >= total) {
      setDone(true);
    } else {
      setIdx(idx + 1);
      setFlipped(false);
    }
  }, [current, idx, total, onAnswer]);

  // Клавиатура
  useEffect(() => {
    const onKey = (e) => {
      if (done) return;
      if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); setFlipped(f => !f); }
      if (!flipped) return;
      if (e.key === '1') handleAnswer('again');
      if (e.key === '2') handleAnswer('hard');
      if (e.key === '3') handleAnswer('good');
      if (e.key === '4') handleAnswer('easy');
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [flipped, done, handleAnswer]);

  if (done) {
    return (
      <SessionDone
        stats={sessionStats}
        total={total}
        onExit={onExit}
      />
    );
  }

  if (!current) return null;

  const cat = CATEGORIES.find(c => c.id === current.cat);
  const progress = progressMap[current.id] || defaultProgress(current.id);

  return (
    <div style={{ maxWidth: 640, margin: '0 auto', padding: '24px 22px 40px', minHeight: '100vh', display: 'flex', flexDirection: 'column' }}>
      {/* Header */}
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', marginBottom: 20 }}>
        <button onClick={onExit} style={{
          display: 'flex', alignItems: 'center', gap: 4, background: 'none', border: 'none',
          color: C.inkSoft, cursor: 'pointer', padding: 4, fontFamily: F.body, fontSize: 13,
        }}>
          <IconChevronLeft size={16} /> Назад
        </button>
        <div style={{ textAlign: 'center', fontFamily: F.body, fontSize: 11, color: C.inkMuted, letterSpacing: '0.1em', textTransform: 'uppercase' }}>
          {title}
        </div>
        <Mono style={{ fontSize: 13, color: C.inkSoft }}>
          {idx + 1}<span style={{ color: C.inkMuted }}>/{total}</span>
        </Mono>
      </div>

      {/* Progress bar */}
      <div style={{ height: 2, background: C.creamDark, borderRadius: 2, marginBottom: 26, overflow: 'hidden' }}>
        <div style={{ height: '100%', width: `${((idx) / total) * 100}%`, background: cat?.accent || C.sage, transition: 'width .3s' }} />
      </div>

      {/* Card */}
      <div style={{ flex: 1, display: 'flex', alignItems: 'center', justifyContent: 'center', perspective: 1200, minHeight: 360 }}>
        <div
          onClick={() => setFlipped(f => !f)}
          style={{
            width: '100%', height: 360, position: 'relative', cursor: 'pointer',
            transformStyle: 'preserve-3d', transition: 'transform .55s cubic-bezier(.4,.0,.2,1)',
            transform: flipped ? 'rotateY(180deg)' : 'rotateY(0deg)',
          }}>
          {/* FRONT */}
          <CardFace>
            <div style={{ position: 'absolute', top: 18, left: 22 }}>
              <Pill bg="transparent" color={cat?.accent || C.sage} style={{ padding: 0, fontSize: 10 }}>
                {cat?.name}
              </Pill>
            </div>
            <div style={{ position: 'absolute', top: 18, right: 22 }}>
              <LevelDots level={progress.level} accent={cat?.accent || C.sage} />
            </div>
            <div style={{ textAlign: 'center', width: '100%' }}>
              <div className="bbn-ar-front" style={{
                fontFamily: F.arabic, color: C.ink, lineHeight: 1.3, direction: 'rtl', marginBottom: 14,
                textShadow: '0 1px 0 rgba(0,0,0,0.02)', wordBreak: 'break-word',
              }}>
                {current.ar}
              </div>
              <div style={{ fontFamily: F.serif, fontStyle: 'italic', fontSize: 14, color: C.inkMuted, letterSpacing: '0.04em' }}>
                нажми, чтобы открыть
              </div>
            </div>
          </CardFace>

          {/* BACK */}
          <CardFace flipped accent={cat?.accent || C.sage}>
            <div style={{ position: 'absolute', top: 18, left: 22 }}>
              <Pill bg="transparent" color={cat?.accent || C.sage} style={{ padding: 0, fontSize: 10 }}>
                {cat?.name}
              </Pill>
            </div>
            <div style={{ textAlign: 'center', padding: '0 24px', width: '100%' }}>
              <div className="bbn-ar-back" style={{
                fontFamily: F.arabic, color: C.inkSoft, lineHeight: 1.2, direction: 'rtl', marginBottom: 18,
                wordBreak: 'break-word',
              }}>
                {current.ar}
              </div>
              <div style={{ width: 40, height: 1, background: cat?.accent || C.sage, margin: '0 auto 18px', opacity: 0.5 }} />
              <FrameTitle style={{ fontSize: 30, color: C.ink, marginBottom: 8 }}>
                {current.ru}
              </FrameTitle>
              <Mono style={{ fontSize: 13, color: C.inkMuted, letterSpacing: '0.03em' }}>
                {current.tr}
              </Mono>
            </div>
          </CardFace>
        </div>
      </div>

      {/* Answer buttons */}
      <div style={{ marginTop: 24 }}>
        {!flipped ? (
          <div style={{ textAlign: 'center', fontFamily: F.body, fontSize: 12, color: C.inkMuted, padding: '14px 0' }}>
            <span style={{ opacity: 0.7 }}>Пробел / клик — перевернуть</span>
          </div>
        ) : (
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 8 }}>
            <AnswerBtn label="Снова" hint="1" grade="again" onClick={() => handleAnswer('again')} bg={C.terracotta} fg="#FFF8EE" />
            <AnswerBtn label="Трудно" hint="2" grade="hard" onClick={() => handleAnswer('hard')} bg={C.gold} fg="#FFF8EE" />
            <AnswerBtn label="Хорошо" hint="3" grade="good" onClick={() => handleAnswer('good')} bg={C.sage} fg="#FFF8EE" />
            <AnswerBtn label="Легко" hint="4" grade="easy" onClick={() => handleAnswer('easy')} bg={C.ink} fg="#FFF8EE" />
          </div>
        )}
      </div>
    </div>
  );
};

                  {w.ru}
                </div>
                <Mono style={{ fontSize: 11, color: C.inkMuted }}>{w.tr}</Mono>
              </div>
              <div style={{ flex: '0 0 auto' }}>
                <LevelDots level={p.level} accent={cat.accent} />
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
};

// ============================================================
// Утилиты
// ============================================================
function plural(n, one, few, many) {
  const m = Math.abs(n) % 100;
  const m1 = m % 10;
  if (m > 10 && m < 20) return many;
  if (m1 > 1 && m1 < 5) return few;
  if (m1 === 1) return one;
  return many;
}

// ============================================================
// ROOT
// ============================================================
function App() {
  const [view, setView] = useState({ name: 'home' });
  const [progressMap, setProgressMap] = useState({});
  const [loaded, setLoaded] = useState(false);

  // Загрузка
  useEffect(() => {
    try {
      const v = localStorage.getItem(STORAGE_KEY);
      if (v) setProgressMap(JSON.parse(v));
    } catch (e) {}
    setLoaded(true);
  }, []);

  // Сохранение
  const saveProgress = useCallback((map) => {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(map)); }
    catch (e) { console.warn('storage write failed', e); }
  }, []);

  const handleAnswer = useCallback((wordId, grade) => {
    setProgressMap(prev => {
      const current = prev[wordId] || defaultProgress(wordId);
      const next = applyAnswer(current, grade);
      const newMap = { ...prev, [wordId]: next };
      saveProgress(newMap);
      return newMap;
    });
  }, [saveProgress]);

  const handleReset = useCallback(() => {
    if (!window.confirm('Сбросить весь прогресс? Это действие необратимо.')) return;
    setProgressMap({});
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }, []);

  // Подготовка колод
  const startCategory = (catId) => setView({ name: 'category', catId });

  const startSession = (catId) => {
    const deck = WORDS.filter(w => w.cat === catId);
    setView({ name: 'session', deck, title: CATEGORIES.find(c => c.id === catId).name.toUpperCase() });
  };

  const startWeakReview = () => {
    const deck = WORDS.filter(w => {
      const p = progressMap[w.id];
      return p && p.level === 0 && p.seen > 0;
    });
    if (deck.length === 0) return;
    setView({ name: 'session', deck, title: 'НА ПОВТОРЕНИЕ' });
  };

  const startDueReview = () => {
    const now = Date.now();
    const deck = WORDS.filter(w => {
      const p = progressMap[w.id];
      return p && p.seen > 0 && p.nextReview <= now;
    });
    if (deck.length === 0) return;
    setView({ name: 'session', deck, title: 'ЗАПЛАНИРОВАННЫЕ' });
  };

  const startNewWords = () => {
    const deck = WORDS.filter(w => {
      const p = progressMap[w.id];
      return !p || p.seen === 0;
    }).slice(0, 15);
    if (deck.length === 0) return;
    setView({ name: 'session', deck, title: 'НОВЫЕ СЛОВА' });
  };

  if (!loaded) {
    return (
      <div style={{ minHeight: '100vh', background: C.cream, display: 'grid', placeItems: 'center' }}>
          <div style={{ fontFamily: F.serif, color: C.inkMuted, fontStyle: 'italic' }}>загрузка…</div>
      </div>
    );
  }

  return (
    <div style={{
      minHeight: '100vh',
      background: C.cream,
      backgroundImage: `
        radial-gradient(circle at 20% 0%, rgba(196,113,78,0.04) 0%, transparent 50%),
        radial-gradient(circle at 80% 100%, rgba(138,154,123,0.05) 0%, transparent 50%)
      `,
      color: C.ink,
    }}>
      <style>{`
        * { box-sizing: border-box; }
        button:focus-visible { outline: 2px solid ${C.terracotta}; outline-offset: 2px; }
        .bbn-ar-front { font-size: 64px; }
        .bbn-ar-back  { font-size: 38px; }
        @media (max-width: 480px) {
          .bbn-ar-front { font-size: 48px; }
          .bbn-ar-back  { font-size: 30px; }
        }
        @media (max-width: 360px) {
          .bbn-ar-front { font-size: 38px; }
          .bbn-ar-back  { font-size: 26px; }
        }
      `}</style>

      {view.name === 'home' && (
        <Home
          progressMap={progressMap}
          onPickCategory={startCategory}
          onReviewWeak={startWeakReview}
          onReviewDue={startDueReview}
          onLearnNew={startNewWords}
          onReset={handleReset}
        />
      )}

      {view.name === 'category' && (
        <CategoryView
          catId={view.catId}
          progressMap={progressMap}
          onExit={() => setView({ name: 'home' })}
          onStartSession={() => startSession(view.catId)}
        />
      )}

      {view.name === 'session' && (
        <Session
          deck={view.deck}
          progressMap={progressMap}
          title={view.title}
          onAnswer={handleAnswer}
          onExit={() => setView({ name: 'home' })}
        />
      )}
    </div>
  );
}


    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
