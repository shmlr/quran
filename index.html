  <style>
    :root {
      --cream:#FBF7F0;
      --cream-dark:#F4ECDE;
      --paper:#F8F1E3;
      --paper-2:#FDF9F0;
      --sage:#8A9A7B;
      --terracotta:#C4714E;
      --gold:#B8945F;
      --ink:#2A2017;
      --ink-soft:#5A4D3F;
      --muted:#8B7B6A;
      --rule:#E5DCC8;
      --shadow:0 16px 40px -24px rgba(42,32,23,.35);
      --serif:"Cormorant Garamond", Georgia, serif;
      --body:"Manrope", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --arabic:"Noto Naskh Arabic", "Amiri", "Scheherazade New", serif;
      --mono:"JetBrains Mono", "SF Mono", Consolas, monospace;
    }
    * { box-sizing:border-box; }
    html { min-height:100%; background:var(--cream); }
    body {
      min-height:100%; margin:0; color:var(--ink); font-family:var(--body);
      background:
        radial-gradient(circle at 15% 0%, rgba(196,113,78,.06) 0%, transparent 44%),
        radial-gradient(circle at 85% 100%, rgba(138,154,123,.07) 0%, transparent 46%),
        var(--cream);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    button, input { font:inherit; }
    button { -webkit-tap-highlight-color:transparent; }
    button:focus-visible { outline:2px solid var(--terracotta); outline-offset:3px; }
    .app { max-width:820px; margin:0 auto; padding:28px 18px 76px; }
    .topline { display:flex; align-items:center; justify-content:space-between; gap:16px; margin-bottom:16px; }
    .pill {
      display:inline-flex; align-items:center; gap:6px; padding:5px 10px; border-radius:999px;
      color:var(--muted); background:rgba(248,241,227,.72); border:1px solid var(--rule);
      font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
    }
    .mini-btn {
      border:1px solid var(--rule); background:rgba(248,241,227,.74); color:var(--ink-soft);
      border-radius:999px; padding:8px 11px; cursor:pointer; font-size:12px; font-weight:700;
    }
    .mini-btn:hover { border-color:var(--terracotta); }
    .hero { margin:0 0 22px; }
    .hero-ar { font-family:var(--arabic); font-size:clamp(38px, 8vw, 58px); line-height:1.1; direction:rtl; }
    .hero-title { font-family:var(--serif); font-size:clamp(24px, 5vw, 34px); font-style:italic; color:var(--ink-soft); margin-top:4px; }
    .hero-text { max-width:620px; color:var(--muted); font-size:14px; line-height:1.65; margin:10px 0 0; }
    .stats {
      display:grid; grid-template-columns:repeat(4, 1fr); gap:10px; margin:24px 0;
      padding:14px; background:rgba(248,241,227,.8); border:1px solid var(--rule); border-radius:20px;
    }
    .stat { padding:8px 6px; text-align:center; }
    .stat-value { display:block; font-family:var(--mono); font-size:22px; line-height:1.1; color:var(--ink); }
    .stat-label { display:block; margin-top:5px; font-size:10px; line-height:1.25; color:var(--muted); letter-spacing:.08em; text-transform:uppercase; }
    .actions { display:grid; gap:10px; margin:0 0 30px; }
    .action {
      width:100%; display:flex; justify-content:space-between; align-items:center; gap:16px; text-align:left;
      border:0; border-radius:18px; padding:17px 18px; cursor:pointer; color:#FFF8EE; box-shadow:var(--shadow);
      transition:transform .14s ease, opacity .14s ease, filter .14s ease;
    }
    .action:hover { transform:translateY(-1px); filter:saturate(1.05); }
    .action:disabled { cursor:not-allowed; opacity:.45; transform:none; filter:grayscale(.15); }
    .action-title { display:block; font-family:var(--serif); font-size:22px; font-weight:600; line-height:1.05; }
    .action-sub { display:block; margin-top:4px; font-size:12px; line-height:1.35; opacity:.82; }
    .action-num { font-family:var(--mono); font-size:22px; opacity:.92; }
    .section-head { display:flex; align-items:baseline; justify-content:space-between; gap:12px; margin:28px 0 12px; }
    .section-title { font-family:var(--serif); font-size:26px; font-weight:600; margin:0; }
    .section-note { font-family:var(--mono); font-size:11px; color:var(--muted); }
    .categories { display:grid; grid-template-columns:repeat(auto-fill, minmax(235px, 1fr)); gap:10px; }
    .category {
      text-align:left; border:1px solid var(--rule); background:rgba(248,241,227,.83); border-radius:18px;
      padding:16px; cursor:pointer; min-height:132px; overflow:hidden; transition:border-color .14s ease, transform .14s ease, background .14s ease;
    }
    .category:hover { transform:translateY(-1px); border-color:var(--cat); background:#FFF9EF; }
    .cat-top { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:12px; }
    .cat-index { font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--cat); }
    .cat-name { font-family:var(--serif); font-size:20px; line-height:1.08; margin-top:4px; }
    .cat-ar { font-family:var(--arabic); font-size:20px; line-height:1.2; direction:rtl; color:var(--cat); opacity:.9; }
    .cat-meta { color:var(--muted); font-size:12px; line-height:1.4; }
    .bar { height:4px; margin-top:12px; background:var(--cream-dark); border-radius:99px; overflow:hidden; }
    .bar > i { display:block; height:100%; width:0%; background:var(--cat, var(--sage)); border-radius:99px; transition:width .24s ease; }
    .back {
      display:inline-flex; align-items:center; gap:6px; border:0; background:none; color:var(--ink-soft);
      padding:6px 0; cursor:pointer; font-size:13px; margin-bottom:14px;
    }
    .panel {
      background:rgba(248,241,227,.82); border:1px solid var(--rule); border-radius:22px; padding:18px;
      box-shadow:0 1px 0 rgba(42,32,23,.03);
    }
    .cat-page-head { display:flex; align-items:flex-start; justify-content:space-between; gap:16px; margin-bottom:18px; }
    .cat-page-ar { font-family:var(--arabic); font-size:36px; direction:rtl; color:var(--cat); line-height:1.1; }
    .cat-page-title { font-family:var(--serif); font-size:34px; line-height:1.05; margin:4px 0; }
    .primary {
      width:100%; border:0; border-radius:16px; padding:16px 18px; cursor:pointer; color:#FFF8EE;
      background:var(--cat, var(--ink)); font-family:var(--serif); font-size:21px; font-weight:600; margin:8px 0 18px;
    }
    .word-list { display:grid; gap:8px; }
    .word-row {
      display:grid; grid-template-columns:minmax(88px, auto) 1fr auto; gap:14px; align-items:center;
      background:#FDF9F0; border:1px solid var(--rule); border-radius:15px; padding:12px 14px;
    }
    .word-ar { font-family:var(--arabic); font-size:25px; line-height:1.25; direction:rtl; text-align:right; }
    .word-ru { font-family:var(--serif); font-size:19px; line-height:1.1; }
    .word-tr { margin-top:3px; font-family:var(--mono); font-size:11px; color:var(--muted); }
    .dots { display:flex; gap:4px; }
    .dot { width:6px; height:6px; border-radius:999px; background:var(--rule); }
    .dot.on { background:var(--cat, var(--sage)); }
    .session { min-height:calc(100vh - 36px); display:flex; flex-direction:column; max-width:680px; margin:0 auto; padding:24px 18px 44px; }
    .session-head { display:grid; grid-template-columns:auto 1fr auto; align-items:center; gap:10px; margin-bottom:16px; }
    .session-title { text-align:center; color:var(--muted); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .counter { font-family:var(--mono); font-size:13px; color:var(--ink-soft); }
    .session-progress { height:3px; background:var(--cream-dark); border-radius:99px; overflow:hidden; margin-bottom:24px; }
    .session-progress > i { display:block; height:100%; background:var(--cat, var(--sage)); width:0%; transition:width .25s ease; }
    .card-wrap { flex:1; display:grid; place-items:center; perspective:1200px; min-height:330px; }
    .card {
      position:relative; width:100%; height:min(390px, 62vh); min-height:320px; cursor:pointer; transform-style:preserve-3d;
      transition:transform .48s cubic-bezier(.4,0,.2,1);
    }
    .card.is-flipped { transform:rotateY(180deg); }
    .face {
      position:absolute; inset:0; backface-visibility:hidden; border-radius:26px; border:1px solid var(--rule);
      background:var(--paper); box-shadow:var(--shadow); display:flex; align-items:center; justify-content:center; padding:42px 20px;
    }
    .face.back-face { transform:rotateY(180deg); background:#FDF9F0; border-color:color-mix(in srgb, var(--cat) 70%, var(--rule)); }
    .card-label { position:absolute; top:18px; left:20px; color:var(--cat); font-size:10px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; }
    .card-level { position:absolute; top:21px; right:20px; }
    .card-center { width:100%; text-align:center; }
    .card-ar-front { font-family:var(--arabic); font-size:clamp(44px, 12vw, 72px); line-height:1.25; direction:rtl; word-break:break-word; }
    .card-ar-back { font-family:var(--arabic); font-size:clamp(30px, 7vw, 42px); color:var(--ink-soft); line-height:1.25; direction:rtl; word-break:break-word; }
    .hint { margin-top:14px; color:var(--muted); font-family:var(--serif); font-style:italic; font-size:15px; }
    .divider { width:44px; height:1px; background:var(--cat); opacity:.55; margin:18px auto; }
    .translation { font-family:var(--serif); font-size:clamp(30px, 8vw, 44px); line-height:1.05; }
    .translit { margin-top:10px; font-family:var(--mono); font-size:13px; color:var(--muted); letter-spacing:.03em; }
    .answers { display:grid; grid-template-columns:repeat(4, 1fr); gap:8px; margin-top:24px; }
    .answer {
      border:0; border-radius:15px; padding:14px 6px; color:#FFF8EE; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:4px;
      transition:transform .12s ease, opacity .12s ease;
    }
    .answer:hover { transform:translateY(-1px); }
    .answer b { font-family:var(--serif); font-size:17px; font-weight:600; }
    .answer span { font-family:var(--mono); font-size:10px; opacity:.65; }
    .flip-note { margin-top:24px; text-align:center; color:var(--muted); font-size:12px; padding:15px 0; }
    .done { max-width:620px; margin:0 auto; padding:80px 18px; text-align:center; }
    .done-ar { font-family:var(--arabic); font-size:42px; color:var(--sage); direction:rtl; }
    .done-title { font-family:var(--serif); font-size:42px; margin:6px 0; }
    .done-stats {
      display:grid; grid-template-columns:repeat(3, 1fr); gap:10px; border-top:1px solid var(--rule); border-bottom:1px solid var(--rule);
      margin:34px 0; padding:24px 0;
    }
    .settings { margin-top:42px; padding-top:20px; border-top:1px solid var(--rule); color:var(--muted); font-size:12px; line-height:1.55; }
    .settings-row { display:flex; gap:10px; flex-wrap:wrap; margin-top:10px; }
    .danger { color:#9f3a25; border-color:#e6c6b8; background:#FFF5EF; }
    .empty { padding:24px; text-align:center; color:var(--muted); background:rgba(248,241,227,.7); border:1px dashed var(--rule); border-radius:18px; }
    .hide { display:none !important; }
    @media (max-width:640px) {
      .app { padding:24px 14px 64px; }
      .stats { grid-template-columns:repeat(2, 1fr); }
      .categories { grid-template-columns:1fr; }
      .word-row { grid-template-columns:86px 1fr; }
      .word-row .dots { grid-column:1 / -1; justify-content:flex-end; }
      .answers { grid-template-columns:repeat(2, 1fr); }
      .cat-page-head { display:block; }
      .cat-page-ar { margin-top:8px; }
    }
    @media (max-width:380px) {
      .hero-ar { font-size:34px; }
      .action-title { font-size:20px; }
      .session { padding-left:12px; padding-right:12px; }
      .card { min-height:300px; height:56vh; }
      .face { border-radius:22px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior:auto !important; transition:none !important; animation:none !important; }
    }
  </style>
</head>

  <script>
    'use strict';

    const CATEGORIES = JSON.parse(document.getElementById('categories-data').textContent);
    const WORDS = JSON.parse(document.getElementById('words-data').textContent);

    const STORAGE_KEY = 'quran_vocab_v1';
    const INTERVALS_DAYS = [0, 1, 3, 7, 14, 30];
    const MS_DAY = 24 * 60 * 60 * 1000;

    const app = document.getElementById('app');
    const byCat = Object.fromEntries(CATEGORIES.map(c => [c.id, c]));
    let progressMap = loadProgress();
    let view = { name: 'home' };
    let session = null;

    function esc(value) {
      return String(value ?? '').replace(/[&<>'"]/g, ch => {
        if (ch === '&') return '&amp;';
        if (ch === '<') return '&lt;';
        if (ch === '>') return '&gt;';
        if (ch === "'") return '&#39;';
        return '&quot;';
      });
    }

    function plural(n, one, few, many) {
      const m = Math.abs(n) % 100;
      const m1 = m % 10;
      if (m > 10 && m < 20) return many;
      if (m1 > 1 && m1 < 5) return few;
      if (m1 === 1) return one;
      return many;
    }

    function defaultProgress(id) {
      return { id, level: 0, nextReview: Date.now(), lastReview: null, seen: 0, correct: 0 };
    }

    function sanitizeProgress(raw) {
      if (!raw || typeof raw !== 'object' || Array.isArray(raw)) return {};
      const allowedIds = new Set(WORDS.map(w => String(w.id)));
      const clean = {};
      for (const [id, item] of Object.entries(raw)) {
        if (!allowedIds.has(String(id)) || !item || typeof item !== 'object' || Array.isArray(item)) continue;
        const level = Number.isFinite(Number(item.level)) ? Math.max(0, Math.min(5, Math.round(Number(item.level)))) : 0;
        const seen = Number.isFinite(Number(item.seen)) ? Math.max(0, Math.round(Number(item.seen))) : 0;
        const correct = Number.isFinite(Number(item.correct)) ? Math.max(0, Math.round(Number(item.correct))) : 0;
        const nextReview = Number.isFinite(Number(item.nextReview)) ? Number(item.nextReview) : Date.now();
        const lastReview = Number.isFinite(Number(item.lastReview)) ? Number(item.lastReview) : null;
        clean[id] = { id: Number(id), level, nextReview, lastReview, seen, correct };
      }
      return clean;
    }

    function loadProgress() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (!raw) return {};
        return sanitizeProgress(JSON.parse(raw));
      } catch (e) {
        console.warn('Не удалось прочитать прогресс:', e);
        return {};
      }
    }

    function saveProgress() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progressMap));
      } catch (e) {
        console.warn('Не удалось сохранить прогресс:', e);
      }
    }

    function scheduleNext(level) {
      const days = INTERVALS_DAYS[Math.min(Math.max(level, 0), INTERVALS_DAYS.length - 1)];
      return Date.now() + days * MS_DAY;
    }

    function applyAnswer(item, grade) {
      const p = item || defaultProgress(0);
      let nextLevel = p.level;
      if (grade === 'again') nextLevel = 0;
      if (grade === 'hard') nextLevel = Math.max(0, p.level - 1);
      if (grade === 'good') nextLevel = Math.min(5, p.level + 1);
      if (grade === 'easy') nextLevel = Math.min(5, p.level + 2);
      return {
        ...p,
        level: nextLevel,
        nextReview: scheduleNext(nextLevel),
        lastReview: Date.now(),
        seen: p.seen + 1,
        correct: p.correct + (grade === 'again' ? 0 : 1)
      };
    }

    function shuffle(list) {
      const arr = [...list];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function getStats() {
      let learned = 0, weak = 0, due = 0, seen = 0, fresh = 0;
      const now = Date.now();
      for (const word of WORDS) {
        const p = progressMap[word.id] || defaultProgress(word.id);
        if (p.level >= 4) learned++;
        if (p.level === 0 && p.seen > 0) weak++;
        if (p.seen > 0 && p.nextReview <= now) due++;
        if (p.seen > 0) seen++; else fresh++;
      }
      return { learned, weak, due, seen, fresh };
    }

    function getCategoryStats() {
      const stats = {};
      for (const cat of CATEGORIES) stats[cat.id] = { total: 0, learned: 0, seen: 0, weak: 0, due: 0 };
      const now = Date.now();
      for (const word of WORDS) {
        const s = stats[word.cat];
        const p = progressMap[word.id] || defaultProgress(word.id);
        s.total++;
        if (p.level >= 4) s.learned++;
        if (p.seen > 0) s.seen++;
        if (p.level === 0 && p.seen > 0) s.weak++;
        if (p.seen > 0 && p.nextReview <= now) s.due++;
      }
      return stats;
    }

    function dots(level, accent) {
      let html = `<div class="dots" style="--cat:${accent}">`;
      for (let i = 0; i < 6; i++) html += `<i class="dot ${i < level ? 'on' : ''}"></i>`;
      return html + '</div>';
    }

    function render() {
      if (view.name === 'home') return renderHome();
      if (view.name === 'category') return renderCategory(view.catId);
      if (view.name === 'session') return renderSession();
      if (view.name === 'done') return renderDone();
    }

    function renderHome() {
      const totals = getStats();
      const catStats = getCategoryStats();
      app.className = 'app';
      app.innerHTML = `
        <div class="topline">
          <span class="pill">مفردات · словарь</span>
          <button class="mini-btn" data-action="settings">Настройки</button>
        </div>
        <section class="hero">
          <div class="hero-ar">كَلِمَاتُ القُرْآنِ</div>
          <div class="hero-title">Топ-300 частых слов Корана</div>
          <p class="hero-text">Учебные карточки с интервальным повторением. Прогресс сохраняется на этом устройстве.</p>
        </section>
        <section class="stats" aria-label="Статистика">
          ${statCell('Изучено', totals.learned, WORDS.length)}
          ${statCell('Сегодня', totals.due, null)}
          ${statCell('Слабые', totals.weak, null)}
          ${statCell('Видел', totals.seen, WORDS.length)}
        </section>
        <section class="actions" aria-label="Быстрые действия">
          ${actionButton('today', 'Повторить сегодня', `${totals.due} ${plural(totals.due, 'карточка ждёт', 'карточки ждут', 'карточек ждут')}`, totals.due, 'var(--sage)', totals.due === 0)}
          ${actionButton('new', 'Учить 15 новых слов', `${totals.fresh} ${plural(totals.fresh, 'новое слово осталось', 'новых слова осталось', 'новых слов осталось')}`, 15, 'var(--ink)', totals.fresh === 0)}
          ${actionButton('weak', 'Слабые слова', `${totals.weak} ${plural(totals.weak, 'слово требует внимания', 'слова требуют внимания', 'слов требуют внимания')}`, totals.weak, 'var(--terracotta)', totals.weak === 0)}
        </section>
        <div class="section-head">
          <h2 class="section-title">Разделы</h2>
          <span class="section-note">${CATEGORIES.length} тем · ${WORDS.length} слов</span>
        </div>
        <section class="categories">
          ${CATEGORIES.map((cat, index) => categoryCard(cat, catStats[cat.id], index)).join('')}
        </section>
        <section id="settings" class="settings hide">
          <b>Настройки</b><br>
          Прогресс хранится только в браузере этого устройства. После очистки браузера он может пропасть.
          <div class="settings-row">
            <button class="mini-btn" data-action="export">Экспорт прогресса</button>
            <button class="mini-btn" data-action="import">Импорт прогресса</button>
            <button class="mini-btn danger" data-action="reset">Сбросить прогресс</button>
          </div>
        </section>
      `;
    }

    function statCell(label, value, max) {
      return `<div class="stat"><span class="stat-value">${esc(value)}${max ? `<small style="font-size:12px;color:var(--muted)">/${max}</small>` : ''}</span><span class="stat-label">${esc(label)}</span></div>`;
    }

    function actionButton(action, title, subtitle, num, bg, disabled) {
      return `
        <button class="action" data-action="${esc(action)}" style="background:${bg}" ${disabled ? 'disabled' : ''}>
          <span><span class="action-title">${esc(title)}</span><span class="action-sub">${esc(subtitle)}</span></span>
          <span class="action-num">${esc(num)}</span>
        </button>`;
    }

    function categoryCard(cat, stats, index) {
      const pct = stats.total ? Math.round((stats.learned / stats.total) * 100) : 0;
      return `
        <button class="category" data-cat="${esc(cat.id)}" style="--cat:${esc(cat.accent)}">
          <div class="cat-top">
            <div><div class="cat-index">${String(index + 1).padStart(2, '0')}</div><div class="cat-name">${esc(cat.name)}</div></div>
            <div class="cat-ar">${esc(cat.ar)}</div>
          </div>
          <div class="cat-meta">${stats.learned} / ${stats.total} выучено${stats.weak ? ` · ${stats.weak} слаб.` : ''}</div>
          <div class="bar"><i style="width:${pct}%"></i></div>
        </button>`;
    }

    function renderCategory(catId) {
      const cat = byCat[catId];
      if (!cat) { view = { name:'home' }; return render(); }
      const words = WORDS.filter(w => w.cat === catId);
      const learned = words.filter(w => (progressMap[w.id] || defaultProgress(w.id)).level >= 4).length;
      app.className = 'app';
      app.innerHTML = `
        <button class="back" data-action="home">← К разделам</button>
        <section class="panel" style="--cat:${esc(cat.accent)}">
          <div class="cat-page-head">
            <div>
              <div class="cat-page-title">${esc(cat.name)}</div>
              <div style="color:var(--muted);font-size:13px">${words.length} слов · ${learned} выучено</div>
            </div>
            <div class="cat-page-ar">${esc(cat.ar)}</div>
          </div>
          <button class="primary" data-action="start-category" data-cat="${esc(cat.id)}">Начать сессию</button>
          <div class="word-list">
            ${words.map(w => wordRow(w, cat)).join('')}
          </div>
        </section>`;
    }

    function wordRow(word, cat) {
      const p = progressMap[word.id] || defaultProgress(word.id);
      return `
        <div class="word-row" style="--cat:${esc(cat.accent)}">
          <div class="word-ar">${esc(word.ar)}</div>
          <div><div class="word-ru">${esc(word.ru)}</div><div class="word-tr">${esc(word.tr)}</div></div>
          ${dots(p.level, cat.accent)}
        </div>`;
    }

    function startSession(deck, title) {
      if (!deck.length) return;
      session = { deck: shuffle(deck), title, idx: 0, flipped: false, stats: { correct: 0, wrong: 0 } };
      view = { name: 'session' };
      render();
    }

    function startNewWords() {
      const deck = WORDS.filter(w => {
        const p = progressMap[w.id];
        return !p || p.seen === 0;
      }).slice(0, 15);
      startSession(deck, 'Новые слова');
    }

    function startDueReview() {
      const now = Date.now();
      const deck = WORDS.filter(w => {
        const p = progressMap[w.id];
        return p && p.seen > 0 && p.nextReview <= now;
      }).sort((a, b) => progressMap[a.id].nextReview - progressMap[b.id].nextReview);
      startSession(deck, 'Сегодня к повторению');
    }

    function startWeakReview() {
      const deck = WORDS.filter(w => {
        const p = progressMap[w.id];
        return p && p.level === 0 && p.seen > 0;
      });
      startSession(deck, 'Слабые слова');
    }

    function renderSession() {
      const current = session?.deck[session.idx];
      if (!current) { view = { name: 'done' }; return render(); }
      const cat = byCat[current.cat] || CATEGORIES[0];
      const p = progressMap[current.id] || defaultProgress(current.id);
      const total = session.deck.length;
      const pct = Math.round(((session.idx + 1) / total) * 100);
      app.className = 'session';
      app.innerHTML = `
        <div class="session-head" style="--cat:${esc(cat.accent)}">
          <button class="back" data-action="home">← Назад</button>
          <div class="session-title">${esc(session.title)}</div>
          <div class="counter">${session.idx + 1}<span style="color:var(--muted)">/${total}</span></div>
        </div>
        <div class="session-progress" style="--cat:${esc(cat.accent)}"><i style="width:${pct}%"></i></div>
        <section class="card-wrap" style="--cat:${esc(cat.accent)}">
          <button class="card ${session.flipped ? 'is-flipped' : ''}" data-action="flip" aria-label="Перевернуть карточку">
            <div class="face">
              <div class="card-label">${esc(cat.name)}</div>
              <div class="card-level">${dots(p.level, cat.accent)}</div>
              <div class="card-center"><div class="card-ar-front">${esc(current.ar)}</div><div class="hint">нажми, чтобы открыть</div></div>
            </div>
            <div class="face back-face">
              <div class="card-label">${esc(cat.name)}</div>
              <div class="card-center">
                <div class="card-ar-back">${esc(current.ar)}</div>
                <div class="divider"></div>
                <div class="translation">${esc(current.ru)}</div>
                <div class="translit">${esc(current.tr)}</div>
              </div>
            </div>
          </button>
        </section>
        ${session.flipped ? answerButtons() : '<div class="flip-note">Пробел / Enter / клик — открыть ответ</div>'}
      `;
    }

    function answerButtons() {
      return `
        <div class="answers">
          <button class="answer" data-grade="again" style="background:var(--terracotta)"><b>Снова</b><span>1</span></button>
          <button class="answer" data-grade="hard" style="background:var(--gold)"><b>Трудно</b><span>2</span></button>
          <button class="answer" data-grade="good" style="background:var(--sage)"><b>Хорошо</b><span>3</span></button>
          <button class="answer" data-grade="easy" style="background:var(--ink)"><b>Легко</b><span>4</span></button>
        </div>`;
    }

    function answer(grade) {
      const current = session?.deck[session.idx];
      if (!current) return;
      const old = progressMap[current.id] || defaultProgress(current.id);
      progressMap[current.id] = applyAnswer(old, grade);
      if (grade === 'again') session.stats.wrong++; else session.stats.correct++;
      saveProgress();
      if (session.idx + 1 >= session.deck.length) {
        view = { name: 'done' };
      } else {
        session.idx++;
        session.flipped = false;
      }
      render();
    }

    function renderDone() {
      const total = (session?.stats.correct || 0) + (session?.stats.wrong || 0);
      const accuracy = total ? Math.round((session.stats.correct / total) * 100) : 0;
      app.className = 'done';
      app.innerHTML = `
        <div class="done-ar">أَحْسَنْتَ</div>
        <div class="done-title">Готово</div>
        <div style="color:var(--muted);font-family:var(--serif);font-style:italic">Сессия завершена</div>
        <section class="done-stats">
          ${statCell('Верно', session?.stats.correct || 0, null)}
          ${statCell('Снова', session?.stats.wrong || 0, null)}
          ${statCell('Точность', accuracy + '%', null)}
        </section>
        <button class="action" data-action="home" style="background:var(--ink);justify-content:center"><span class="action-title">Вернуться на главный экран</span></button>
      `;
    }

    function exportProgress() {
      const data = JSON.stringify({ app: 'quran-vocab', version: 2, exportedAt: new Date().toISOString(), progress: progressMap }, null, 2);
      navigator.clipboard?.writeText(data).then(() => alert('Прогресс скопирован в буфер обмена.'))
        .catch(() => prompt('Скопируй прогресс вручную:', data));
    }

    function importProgress() {
      const raw = prompt('Вставь экспортированный JSON прогресса:');
      if (!raw) return;
      try {
        const parsed = JSON.parse(raw);
        const candidate = parsed.progress || parsed;
        progressMap = sanitizeProgress(candidate);
        saveProgress();
        alert('Прогресс импортирован.');
        render();
      } catch (e) {
        alert('Не удалось импортировать: JSON повреждён.');
      }
    }

    function resetProgress() {
      if (!confirm('Сбросить весь прогресс? Это действие нельзя отменить.')) return;
      progressMap = {};
      try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
      render();
    }

    app.addEventListener('click', (event) => {
      const actionEl = event.target.closest('[data-action], [data-cat], [data-grade]');
      if (!actionEl) return;
      const action = actionEl.dataset.action;
      const catId = actionEl.dataset.cat;
      const grade = actionEl.dataset.grade;

      if (catId && !action) { view = { name: 'category', catId }; render(); return; }
      if (grade) { answer(grade); return; }

      if (action === 'home') { view = { name: 'home' }; session = null; render(); }
      if (action === 'settings') document.getElementById('settings')?.classList.toggle('hide');
      if (action === 'today') startDueReview();
      if (action === 'new') startNewWords();
      if (action === 'weak') startWeakReview();
      if (action === 'start-category') startSession(WORDS.filter(w => w.cat === catId), byCat[catId].name);
      if (action === 'flip') { session.flipped = !session.flipped; render(); }
      if (action === 'export') exportProgress();
      if (action === 'import') importProgress();
      if (action === 'reset') resetProgress();
    });

    window.addEventListener('keydown', (event) => {
      if (view.name !== 'session' || !session) return;
      if (event.key === ' ' || event.key === 'Enter') {
        event.preventDefault();
        session.flipped = !session.flipped;
        render();
        return;
      }
      if (!session.flipped) return;
      if (event.key === '1') answer('again');
      if (event.key === '2') answer('hard');
      if (event.key === '3') answer('good');
      if (event.key === '4') answer('easy');
    });

    render();
  </script>
</body>
</html>
